name: Quality Gates

# PROGRAM-E — Enterprise CI Foundation.
#
# Runs the gates that are measured green and ratcheted. Each job is independent
# so a failure names one thing, not "CI is red".
#
# Four jobs analyse source; one (Production Build) actually builds it. That last
# one is not ratcheted — a bundle either builds or it does not.
#
# Deliberately NOT here yet:
#   • Backend tests — 3,525 methods exist but phpunit.xml forces DB_CONNECTION=mysql
#     while CI installs only pdo_pgsql. Resolving that drift is a breaking change
#     to every developer environment and needs its own decision (see PQ-004).
#   • Frontend tests — 2 test files against 1,010 sources; a gate here would
#     assert coverage that does not exist.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pdo_mysql, mbstring, xml, curl
          # PHPStan's parallel workers crash on this codebase at the 128M
          # default. Measured requirement: 4G platform, 2G core.
          ini-values: memory_limit=4G

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      # PHPStan's result cache makes reruns substantially cheaper. Keyed on the
      # configs and baselines so a policy change invalidates it.
      - name: Cache PHPStan result cache
        uses: actions/cache@v4
        with:
          path: backend/storage/framework/cache/phpstan*
          key: phpstan-${{ hashFiles('backend/phpstan*.neon*') }}-${{ github.sha }}
          restore-keys: phpstan-${{ hashFiles('backend/phpstan*.neon*') }}-

      # Platform-wide, level 0, 4,153 files. Baseline freezes existing debt;
      # any NEW violation fails this job.
      - name: PHPStan — platform (level 0)
        working-directory: backend
        run: php vendor/bin/phpstan analyse --no-progress --memory-limit=4G

      # Core Framework, level 6. Must not regress.
      - name: PHPStan — core (level 6)
        working-directory: backend
        run: php vendor/bin/phpstan analyse --no-progress --memory-limit=2G -c phpstan-core.neon.dist

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --silent

      # tsc -b writes incremental state; caching it turns a cold check into a
      # warm one. Keyed on the tsconfigs so a config change invalidates.
      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.tmp
          key: tsbuildinfo-${{ hashFiles('frontend/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ hashFiles('frontend/tsconfig*.json') }}-

      # Ratchet, not cliff. 309 pre-existing diagnostics are frozen per error
      # code; a NEW one fails. Per-code rather than a single total, because a
      # total hides a regression offset by an improvement elsewhere — exactly
      # how three migration regressions survived a net-favourable count in EPIC-1.
      - name: TypeScript ratchet
        working-directory: frontend
        run: node scripts/typecheck-ratchet.mjs --check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --silent

      # Errors fail. 4,985 pre-existing violations are frozen in
      # eslint-suppressions.json; a NEW violation is not suppressed and fails here.
      - name: ESLint
        working-directory: frontend
        run: npm run lint

  architecture:
    name: Architecture Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Static import parsing only — no compiler, no install needed.
      # Fails only when a ratcheted metric gets WORSE than the recorded baseline.
      - name: Architecture ratchet
        working-directory: frontend
        run: node scripts/analyze-architecture.mjs --check

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --silent

      # The only gate that produces an artifact. Every other job analyses source.
      #
      # It exists because Platform Foundation v2 shipped unbuildable and all four
      # analysis gates were green: module-rail.tsx imported @/features/authorization,
      # a directory never tracked in any commit. PHPStan, ESLint and both ratchets
      # cannot see that — the TypeScript ratchet had even baselined the resulting
      # TS2307 as accepted debt. Only a real bundle fails on it (TASK-INTEGRITY-001).
      #
      # `vite build`, NOT `npm run build`. The npm script is `tsc -b && vite build`,
      # and tsc -b exits non-zero on the 319 baselined diagnostics the TypeScript
      # ratchet owns. Calling it here would make this job a duplicate typecheck that
      # is red on day one — the failure mode that killed three earlier gates. This
      # gate answers exactly one question: does the production bundle build?
      - name: Production build
        working-directory: frontend
        run: npx vite build

      # A zero exit with no bundle would be a silent pass. Assert the artifact.
      # vite.config.ts sets outDir to ../backend/public/app — the frontend builds
      # into Laravel's public directory, not frontend/dist. That path is gitignored
      # (.gitignore:31), so building here does not dirty the working tree.
      - name: Verify build artifacts
        run: |
          OUT=backend/public/app
          test -f "$OUT/index.html" || { echo "::error::$OUT/index.html missing — build produced no entry point"; exit 1; }
          assets=$(find "$OUT/assets" -type f 2>/dev/null | wc -l)
          [ "$assets" -gt 0 ] || { echo "::error::$OUT/assets is empty — build produced no bundles"; exit 1; }
          echo "$OUT/index.html present; $assets asset file(s); $(du -sh "$OUT" | cut -f1) total"

      # Keeps the bundle inspectable when a downstream failure needs diagnosis.
      # Push events only — the output is ~19 MB and PR runs do not need it retained.
      - name: Upload build output
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: backend/public/app
          retention-days: 7
          if-no-files-found: error
