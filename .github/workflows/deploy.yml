name: Deploy

on:
  push:
    branches:
      - main       # → Production
      - develop    # → Staging  (TASK-DEVOPS-001)
      - staging    # → Staging  (legacy branch, retained)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options:
          - development
          - staging
          - production

# Serialize deployments per branch — never cancel an in-flight deploy.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the GitHub Environment from the branch name or manual input.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        name: Determine environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi

          # ── Production originates from main, and only from main ────────────
          # Branch pushes already satisfy this by construction. workflow_dispatch
          # did not: the environment dropdown was selectable from any ref, so a
          # manual run started on develop could target production. This closes
          # that path — it is the single rule that keeps unreviewed code out of
          # Production (TASK-DEVOPS-001 §5).
          if [ "$ENV" = "production" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Production deployment must originate from 'main'." \
                 "Refusing to deploy ref '${{ github.ref_name }}' to production." \
                 "Merge into main via pull request, then deploy from there."
            exit 1
          fi

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Resolved: $ENV"

  # ---------------------------------------------------------------------------
  # Quality gate barrier (TASK-DEVOPS-001 §5).
  #
  # Deploy and Quality Gates both fire on the same push, so they start in
  # parallel. This job waits for the Quality Gates run on this exact SHA and
  # fails if any check failed — nothing reaches Staging or Production without
  # PHPStan, ESLint, both ratchets, the backend suite and the production build
  # having passed on the identical commit.
  #
  # Implemented as a barrier rather than a workflow_run trigger so the existing
  # Production deployment path is not restructured.
  # ---------------------------------------------------------------------------
  gates:
    name: Verify quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      checks: read
      actions: read
    steps:
      - name: Wait for Quality Gates on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Poll the check-runs API. Quality Gates publishes one check per job.
          for i in $(seq 1 150); do
            RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                     --jq '.check_runs[] | select(.name != "Verify quality gates")
                           | "\(.name)|\(.status)|\(.conclusion)"' 2>/dev/null || true)

            if [ -z "$RUNS" ]; then
              echo "[$i] no check runs reported yet…"; sleep 20; continue
            fi

            PENDING=$(echo "$RUNS" | grep -cv '|completed|' || true)
            FAILED=$(echo "$RUNS" | grep -E '\|(failure|cancelled|timed_out)$' || true)

            if [ -n "$FAILED" ]; then
              echo "::error::Quality gates failed on $SHA — deployment blocked."
              echo "$FAILED"
              exit 1
            fi

            if [ "$PENDING" -eq 0 ]; then
              echo "All quality gates passed on $SHA:"
              echo "$RUNS"
              exit 0
            fi

            echo "[$i] $PENDING check(s) still running…"
            sleep 20
          done

          echo "::error::Timed out waiting for quality gates on $SHA."
          exit 1

  # ---------------------------------------------------------------------------
  # Deploy.
  #
  # Secrets required in the GitHub Environment:
  #   DEPLOY_PRIVATE_KEY   ED25519 private key (PEM, real newlines)
  #   DEPLOY_HOST          server hostname or IP
  #   DEPLOY_USER          SSH login user
  #   DEPLOY_PATH          absolute path to the project root on the server
  #   DEPLOY_PORT          SSH port (optional — defaults to 22 if empty)
  #
  # SSH authentication uses webfactory/ssh-agent.
  # No ~/.ssh/config is created. Host, port, and user are passed as explicit
  # command-line arguments to every ssh invocation.
  # SSH_OPTS is exported via $GITHUB_ENV once in "Configure SSH" so every
  # later step gets the same flags without repetition.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy → ${{ needs.resolve.outputs.environment }}
    needs: [resolve, gates]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    timeout-minutes: 30

    # All four secrets available to every step as plain env vars.
    # No per-step env: block needed.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── SSH authentication ─────────────────────────────────────────────────
      # webfactory/ssh-agent receives the raw secret through the Actions
      # expression engine, normalises line endings in Node.js, and loads the
      # key into ssh-agent. No key file is written to disk.
      # SSH_AUTH_SOCK is set automatically for all subsequent steps.
      - name: Load SSH key into agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      # ssh-add -l prints the fingerprint only — never the private key.
      - name: Verify SSH key loaded
        run: |
          COUNT=$(ssh-add -l 2>/dev/null | grep -c 'SHA256' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::SSH agent has no keys. Re-store DEPLOY_PRIVATE_KEY with:" \
                 "cat ~/.ssh/id_ed25519 | gh secret set DEPLOY_PRIVATE_KEY --env <env>"
            exit 1
          fi
          echo "Agent has $COUNT key(s) loaded:"
          ssh-add -l

      # ── SSH connection ─────────────────────────────────────────────────────
      # • DEPLOY_PORT defaults to 22 if the secret is empty.
      # • ssh-keyscan pins the server host key before any connection attempt.
      #   StrictHostKeyChecking=yes then verifies against that pinned key on
      #   every connection — not just the first (accept-new is TOFU, not strict).
      # • SSH_PORT and SSH_OPTS are written to $GITHUB_ENV so that all later
      #   steps reference a single source of truth for connection flags.
      # • BatchMode=yes: fails immediately if the key is rejected — no prompt.
      # • ConnectTimeout=10: fast failure if the server is unreachable.
      - name: Configure SSH and verify connection
        run: |
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Print resolved connection details.
          # GitHub Actions auto-masks every string registered as a secret,
          # so DEPLOY_HOST / DEPLOY_USER / DEPLOY_PORT appear as *** when set.
          echo "Host : $DEPLOY_HOST"
          echo "User : $DEPLOY_USER"
          echo "Port : $PORT"

          # Pin the server host key.
          # stdout (key entries) → known_hosts; stderr (status/errors) → log.
          # || true keeps the step alive so the real SSH error is shown below.
          echo "--- ssh-keyscan ---"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts
          echo "known_hosts: $(wc -l < ~/.ssh/known_hosts) entries"

          # Export SSH connection flags for later steps.
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"
          echo "SSH_OPTS=-p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10" \
               >> "$GITHUB_ENV"

          echo "--- OpenSSH version ---"
          ssh -V

          # Test the connection.  Both stdout and stderr are redirected to a temp
          # file so neither stream is lost if both are written simultaneously.
          echo "--- SSH connection test ---"
          SSH_LOG=$(mktemp)
          set +e
          ssh -p "$PORT" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "$DEPLOY_USER@$DEPLOY_HOST" "echo SSH_OK" \
              >"$SSH_LOG" 2>&1
          SSH_EXIT=$?
          set -e
          echo "Exit code: $SSH_EXIT"
          echo "--- SSH output ---"
          cat "$SSH_LOG"
          echo "---"

          if [ "$SSH_EXIT" -ne 0 ]; then
            # Build the annotation from the log file before removing it.
            # sed escapes bare % so GitHub does not mis-parse them as %xx sequences.
            # awk appends %0A (URL-encoded newline) after every line so the
            # multi-line SSH error renders correctly in the Annotations panel.
            SSH_ANNOTATION=$(sed 's/%/%25/g' "$SSH_LOG" | awk '{printf "%s%%0A",$0}')
            rm -f "$SSH_LOG"
            echo "::error::SSH connection failed (exit $SSH_EXIT)%0A${SSH_ANNOTATION}"
            exit "$SSH_EXIT"
          fi
          rm -f "$SSH_LOG"

      # ── Deployment ────────────────────────────────────────────────────────
      # The repository is updated to the exact target SHA before deploy.sh runs.
      # This guarantees deploy.sh always executes from the post-update codebase,
      # eliminating the self-update race (a running script cannot git pull itself).
      # git reset --hard is safe here: the server never has uncommitted changes.
      - name: Update repository on server
        run: |
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' \
             && git fetch --all --tags --prune \
             && git checkout '${{ github.ref_name }}' \
             && git reset --hard '${{ github.sha }}'"

      - name: Run deploy.sh on server
        run: |
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "export COMPOSER_GITHUB_TOKEN='$COMPOSER_GITHUB_TOKEN'; cd '$DEPLOY_PATH' && bash scripts/deploy.sh '${{ github.sha }}' '${{ github.ref_name }}' '${{ github.actor }}'"

      # ── On failure ────────────────────────────────────────────────────────
      - name: Report failure and rollback hint
        if: failure()
        run: |
          echo "::error::Deployment of ${{ github.sha }} to ${{ needs.resolve.outputs.environment }} FAILED."
          echo ""
          echo "Manual rollback:"
          echo "  ssh $SSH_OPTS $DEPLOY_USER@$DEPLOY_HOST 'cd $DEPLOY_PATH && bash scripts/rollback.sh'"
