; ECOS ERP — Supervisor process manager
; Runs PHP-FPM, the Laravel queue worker, and the scheduler in one container.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------------------
; PHP-FPM — serves the application to Nginx over port 9000
; ---------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Queue workers — process the Redis-backed queues
;
; Every queue the application dispatches to must have a consumer here. As of
; TASK-CUTOVER-002 that is four: finance-posting, engineering, health, default.
; A job pushed to a queue nobody consumes fails silently — it sits in Redis
; forever with no exception, no failed_jobs row and a green healthcheck. That
; was BUG C-1 (TASK-CUTOVER-001): finance-posting and health had no consumer.
;
; The work is split across three programs rather than one worker listening on
; all four, because engineering jobs run with --timeout=3600. A single worker
; would let one hour-long engineering job block general-ledger posting for that
; hour. Separating by work class means no queue can be starved by another.
; ---------------------------------------------------------------------------

; Finance posting — ProcessFinancialEventJob (event → rule → journal entry).
; Isolated deliberately: ledger posting must never queue behind bulk work.
[program:laravel-queue-finance]
command=php /var/www/html/artisan queue:work redis --queue=finance-posting --sleep=3 --tries=3 --max-time=3600 --timeout=300
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=310
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Engineering — long-running pipeline work. Timeout and stopwaitsecs are
; unchanged from the original single-worker configuration, so existing
; engineering queue behaviour is preserved exactly.
[program:laravel-queue-engineering]
command=php /var/www/html/artisan queue:work redis --queue=engineering --sleep=3 --tries=3 --max-time=3600 --timeout=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
priority=21
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; General — health checks (CheckProviderHealthJob) and any unqualified job.
[program:laravel-queue-default]
command=php /var/www/html/artisan queue:work redis --queue=health,default --sleep=3 --tries=3 --max-time=3600 --timeout=300
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=310
priority=22
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Scheduler — runs due scheduled tasks every minute (Laravel schedule:work)
; ---------------------------------------------------------------------------
[program:laravel-schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
numprocs=1
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
