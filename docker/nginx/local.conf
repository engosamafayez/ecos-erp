# =============================================================================
# ECOS ERP — Local development Nginx config (HTTP only, no SSL)
#
# Mounted via docker-compose.override.yml on top of the production config.
# The last bind mount to /etc/nginx/conf.d/default.conf wins, so this file
# replaces default.conf inside the container without touching the source file.
#
# Differences from default.conf:
#   - HTTP only on port 80 — no TLS, no certificate files required
#   - server_name _ catches any hostname (localhost, 127.0.0.1, nginx)
#   - No HTTP→HTTPS redirect; traffic is served directly
#   - Security headers retained for parity with production
# =============================================================================
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # -------------------------------------------------------------------------
    # Security headers (same as production)
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-XSS-Protection         "1; mode=block"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # -------------------------------------------------------------------------
    # Infrastructure endpoints
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /build-info {
        access_log off;
        default_type "application/json; charset=utf-8";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # React SPA — served from public/app/
    # -------------------------------------------------------------------------
    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    location ~* ^/app/assets/.*\.(js|css|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/app/.*\.(svg|ico|png|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /app {
        try_files $uri $uri/ /app/index.html;
    }

    # -------------------------------------------------------------------------
    # User-uploaded media — served from the app-storage volume
    # -------------------------------------------------------------------------
    location ^~ /storage/ {
        alias   /var/www/html/storage/app/public/;
        expires 1d;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Static files
    # -------------------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -------------------------------------------------------------------------
    # Default — static file first, then Laravel index.php
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    # -------------------------------------------------------------------------
    # PHP-FPM proxy
    # -------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass              app:9000;
        fastcgi_index             index.php;
        include                   fastcgi_params;
        fastcgi_param             SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param             DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout      120;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           8 128k;
        fastcgi_busy_buffers_size 256k;
    }

    # -------------------------------------------------------------------------
    # Security: deny access to hidden files (.env, .git, .htaccess)
    # -------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
